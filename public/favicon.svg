<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626"/>
      <stop offset="100%" style="stop-color:#991B1B"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle with gradient -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>
  
  <!-- Medical Cross - Bold and centered -->
  <rect x="26" y="12" width="12" height="40" rx="3" fill="white"/>
  <rect x="12" y="26" width="40" height="12" rx="3" fill="white"/>
  
  <!-- CPY Text at bottom -->
  <text x="32" y="58" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="white" text-anchor="middle">CPY</text>
</svg>
